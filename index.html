<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dylan Musica | Gratis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030303; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 15px; overflow: hidden; background: #000; border: 1px solid #333; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #a3e635; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="h-20 flex items-center justify-between px-6 bg-black border-b border-white/10">
        <div class="flex items-center gap-4">
            <!-- Forzamos la carga de la imagen con una ruta relativa limpia -->
            <img src="./Dylanmusica.jpg" alt="Logo" class="h-12 w-12 object-cover rounded-xl border border-[#a3e635]" onerror="this.src='https://via.placeholder.com/50?text=D'">
            <div>
                <h1 class="text-xl font-black italic tracking-tighter">DYLAN MUSICA</h1>
                <p class="text-[9px] font-bold text-[#a3e635] uppercase">Premium Gratis</p>
            </div>
        </div>

        <div class="flex-1 max-w-xl mx-8">
            <div class="relative flex gap-2">
                <input id="search-input" type="text" placeholder="Busca tu música..." 
                    class="w-full bg-[#111] border border-[#333] px-6 py-3 rounded-xl focus:outline-none focus:border-[#a3e635] font-bold text-white">
                <button onclick="searchMusic()" class="bg-[#a3e635] text-black px-6 py-3 rounded-xl font-black hover:scale-105 transition">BUSCAR</button>
            </div>
        </div>
        
        <div class="hidden lg:block text-[#a3e635] text-[10px] font-black border border-[#a3e635]/20 px-4 py-2 rounded-full">
            ESCUDO AD-BLOCK DYLAN ACTIVE
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <main class="flex-[3] p-8 overflow-y-auto custom-scroll">
            <div class="max-w-5xl mx-auto">
                <div class="video-container" id="player-box">
                    <div class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-900">
                        <p class="text-zinc-600 font-black uppercase text-sm">Dylan Musica v16 - Listo para sonar</p>
                    </div>
                </div>
                <div class="mt-8">
                    <h2 id="current-song" class="text-3xl font-black uppercase italic">Selecciona una canción</h2>
                </div>
            </div>
        </main>

        <aside class="flex-1 bg-black p-6 border-l border-white/5 hidden lg:flex flex-col">
            <h3 class="text-zinc-500 font-black text-xs uppercase mb-6">A continuación</h3>
            <div id="playlist" class="space-y-4 overflow-y-auto custom-scroll"></div>
        </aside>
    </div>

    <!-- Footer -->
    <footer class="h-24 bg-[#050505] border-t border-white/10 flex items-center px-8">
        <div class="flex-1 flex items-center gap-4">
            <img src="./Dylanmusica.jpg" class="w-14 h-14 rounded-lg object-cover" onerror="this.style.display='none'">
            <div>
                <div id="footer-song" class="text-sm font-black truncate w-40">Dylan Music App</div>
                <div class="text-[10px] text-[#a3e635] font-bold">REPRODUCIENDO</div>
            </div>
        </div>
        <div class="flex-[2] flex justify-center">
            <button onclick="location.reload()" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center hover:scale-110 transition">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>
        <div class="flex-1"></div>
    </footer>

    <script>
        function searchMusic() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            // Cambiamos a una URL de búsqueda que YouTube acepta mejor en iframes
            const playerBox = document.getElementById('player-box');
            playerBox.innerHTML = `<iframe src="https://www.youtube.com/embed/videoseries?listType=search&list=${encodeURIComponent(query)}&autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            
            document.getElementById('current-song').innerText = query;
            document.getElementById('footer-song').innerText = query;

            const playlist = document.getElementById('playlist');
            playlist.innerHTML = [1,2,3,4,5].map(i => `
                <div class="flex items-center gap-3 p-3 hover:bg-white/5 rounded-xl cursor-pointer">
                    <div class="w-10 h-10 bg-zinc-900 rounded flex items-center justify-center font-black text-[#a3e635]">${i}</div>
                    <div><p class="text-sm font-bold truncate">${query} Mix</p><p class="text-[10px] text-zinc-600">DYLAN MUSIC</p></div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
