<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dylan Musica | Gratis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030303; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 15px; overflow: hidden; background: #000; border: 1px solid #333; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 15px; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #a3e635; border-radius: 10px; }
        .playlist-item:hover { background: rgba(163,230,53,0.08); }
        .playlist-item.active { background: rgba(163,230,53,0.15); border-left: 3px solid #a3e635; }
        .thumbnail { width: 64px; height: 40px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
        .dl-btn {
            background: linear-gradient(135deg, #a3e635 0%, #65a30d 100%);
            box-shadow: 0 0 18px rgba(163,230,53,0.35);
            animation: pulse-glow 2.5s ease-in-out infinite;
            transition: all 0.2s;
        }
        .dl-btn:hover { transform: scale(1.06); box-shadow: 0 0 28px rgba(163,230,53,0.6); }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 18px rgba(163,230,53,0.35); }
            50% { box-shadow: 0 0 30px rgba(163,230,53,0.65); }
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="h-20 flex items-center justify-between px-6 bg-black border-b border-white/10">
        <div class="flex items-center gap-4">
            <img src="https://raw.githubusercontent.com/Dylamusica/musicagratis/main/Dylanmusica.png" alt="Logo" class="h-12 w-12 object-cover rounded-xl border border-[#a3e635]" onerror="this.src='https://via.placeholder.com/50?text=D'">
            <div>
                <h1 class="text-xl font-black italic tracking-tighter">DYLAN MUSICA</h1>
            </div>
        </div>

        <div class="flex-1 max-w-xl mx-8">
            <div class="relative flex gap-2">
                <input id="search-input" type="text" placeholder="Busca tu música..."
                    class="w-full bg-[#111] border border-[#333] px-6 py-3 rounded-xl focus:outline-none focus:border-[#a3e635] font-bold text-white"
                    onkeydown="if(event.key==='Enter') searchMusic()">
                <button onclick="searchMusic()" class="bg-[#a3e635] text-black px-6 py-3 rounded-xl font-black hover:scale-105 transition">BUSCAR</button>
            </div>
        </div>

        <a href="https://www.mediafire.com/file/7ksxdudhvtnuiaz/DYTA_MUSICA_V16.exe/file" target="_blank"
            class="dl-btn hidden lg:flex items-center gap-2 text-black px-5 py-2.5 rounded-xl font-black text-xs whitespace-nowrap cursor-pointer no-underline">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 16l-6-6h4V4h4v6h4l-6 6zm-6 2h12v2H6v-2z"/></svg>
            ⬇ Descargar EXE para PC — Sin Anuncios
        </a>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <main class="flex-[3] p-8 overflow-y-auto custom-scroll">
            <div class="max-w-5xl mx-auto">
                <div class="video-container" id="player-box">
                    <div class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-900 rounded-[15px]">
                        <svg class="w-16 h-16 text-zinc-700 mb-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <p class="text-zinc-500 font-black uppercase text-sm">Dylan Musica v16</p>
                        <p class="text-zinc-700 text-xs mt-1">Busca una canción para empezar</p>
                    </div>
                </div>

                <div class="mt-6">
                    <h2 id="current-song" class="text-2xl font-black uppercase italic text-zinc-400">Selecciona una canción</h2>
                    <p id="current-channel" class="text-xs text-[#a3e635] font-bold mt-1 uppercase"></p>
                </div>
            </div>
        </main>

        <aside class="flex-1 bg-black p-6 border-l border-white/5 hidden lg:flex flex-col min-w-0">
            <h3 class="text-zinc-500 font-black text-xs uppercase mb-4">A continuación</h3>
            <div id="playlist" class="space-y-2 overflow-y-auto custom-scroll flex-1"></div>
        </aside>
    </div>

    <!-- Footer -->
    <footer class="bg-[#050505] border-t border-white/10 flex flex-col">
        <div class="h-24 flex items-center px-8">
            <div class="flex-1 flex items-center gap-4">
                <img id="footer-thumb" src="https://raw.githubusercontent.com/Dylamusica/musicagratis/main/Dylanmusica.png" class="w-14 h-14 rounded-lg object-cover" onerror="this.style.display='none'">
                <div>
                    <div id="footer-song" class="text-sm font-black truncate w-48">Dylan Music App</div>
                    <div class="text-[10px] text-[#a3e635] font-bold" id="footer-status">LISTO</div>
                </div>
            </div>
            <div class="flex-[2] flex justify-center gap-4 items-center">
                <button onclick="playPrev()" class="w-10 h-10 bg-zinc-800 text-white rounded-full flex items-center justify-center hover:bg-zinc-600 transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button onclick="togglePlay()" id="play-btn" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center hover:scale-110 transition">
                    <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button onclick="playNext()" class="w-10 h-10 bg-zinc-800 text-white rounded-full flex items-center justify-center hover:bg-zinc-600 transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2.5-6l6-4.25v8.5L8.5 12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            <div class="flex-1"></div>
        </div>
        <!-- Copyright -->
        <div class="border-t border-white/5 py-2 text-center text-[10px] text-zinc-600 font-bold uppercase tracking-widest">
            © 2026 Dylan Musica — Todos los derechos reservados
        </div>
    </footer>

    <script>
        let results = [];
        let currentIndex = -1;
        const API_KEY = 'AIzaSyAgTdeWN0DaENfBpIqfJLwGc1WsOgtitcI';

        async function searchMusic() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            document.getElementById('current-song').innerText = 'Buscando...';
            document.getElementById('playlist').innerHTML = '<p class="text-zinc-600 text-xs font-bold">Cargando resultados...</p>';

            try {
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=15&key=${API_KEY}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.error) throw new Error(data.error.message);

                results = data.items || [];

                if (results.length === 0) {
                    document.getElementById('playlist').innerHTML = '<p class="text-zinc-600 text-xs">Sin resultados</p>';
                    return;
                }

                renderPlaylist();
                playVideo(0);

            } catch (err) {
                document.getElementById('current-song').innerText = 'Error al buscar';
                document.getElementById('playlist').innerHTML = `<p class="text-red-400 text-xs font-bold">Error: ${err.message}</p>`;
                console.error(err);
            }
        }

        function renderPlaylist() {
            const playlist = document.getElementById('playlist');
            playlist.innerHTML = results.map((item, i) => {
                const title = item.snippet.title;
                const channel = item.snippet.channelTitle;
                const thumb = item.snippet.thumbnails?.default?.url || '';
                return `
                    <div class="playlist-item flex items-center gap-3 p-2 rounded-xl cursor-pointer transition ${i === currentIndex ? 'active' : ''}" onclick="playVideo(${i})" id="item-${i}">
                        <img src="${thumb}" class="thumbnail" onerror="this.style.display='none'">
                        <div class="min-w-0">
                            <p class="text-xs font-bold truncate leading-tight">${title}</p>
                            <p class="text-[10px] text-zinc-500 truncate">${channel}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function playVideo(index) {
            if (index < 0 || index >= results.length) return;
            currentIndex = index;

            const item = results[index];
            const videoId = item.id.videoId;
            const title = item.snippet.title;
            const channel = item.snippet.channelTitle;
            const thumb = item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url || '';

            document.getElementById('player-box').innerHTML = `<iframe
                src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen>
            </iframe>`;

            document.getElementById('current-song').innerText = title;
            document.getElementById('current-channel').innerText = channel;
            document.getElementById('footer-song').innerText = title;
            document.getElementById('footer-status').innerText = 'REPRODUCIENDO';
            if (thumb) document.getElementById('footer-thumb').src = thumb;

            document.querySelectorAll('.playlist-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            const activeEl = document.getElementById(`item-${index}`);
            if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function playNext() {
            if (results.length === 0) return;
            playVideo((currentIndex + 1) % results.length);
        }

        function playPrev() {
            if (results.length === 0) return;
            playVideo((currentIndex - 1 + results.length) % results.length);
        }

        function togglePlay() {
            if (currentIndex >= 0) playVideo(currentIndex);
        }
    </script>
</body>
</html>
