<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dylan Musica Gratis | Sin Anuncios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #030303; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .sidebar { background-color: #000000; border-right: 1px solid #222; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #111; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .active-glow { border: 2px solid #a3e635; box-shadow: 0 0 15px rgba(163, 230, 53, 0.2); }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Top Bar -->
    <header class="h-16 flex items-center justify-between px-6 bg-[#030303] z-50">
        <div class="flex items-center gap-4">
            <!-- Tu imagen de Logo -->
            <img src="Dylanmusica.jpg" alt="Dylan Musica" class="h-10 w-auto rounded border border-white/10">
            <h1 class="text-xl font-black italic tracking-tighter">DYLAN MUSICA</h1>
        </div>

        <div class="flex-1 max-w-xl mx-8">
            <form onsubmit="searchMusic(event)" class="relative group">
                <input id="search-input" type="text" placeholder="Busca canciones, álbumes o artistas..." 
                    class="w-full bg-[#121212] border border-[#333] px-12 py-2 rounded-full focus:outline-none focus:border-[#a3e635] transition-all">
                <svg class="absolute left-4 top-2.5 w-5 h-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </form>
        </div>

        <div class="hidden md:block text-[#a3e635] text-[10px] font-bold border border-[#a3e635]/30 px-3 py-1 rounded-full">
            ● ESCUDO DYLAN AD-BLOCK V16
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <!-- Main Player Area -->
        <main class="flex-[3] p-6 overflow-y-auto custom-scroll">
            <div class="max-w-4xl mx-auto">
                <div class="video-container shadow-2xl" id="main-player">
                    <div class="absolute inset-0 flex items-center justify-center text-zinc-700">
                        <p class="uppercase font-black tracking-widest">Escribe algo para empezar a escuchar</p>
                    </div>
                </div>
                
                <div class="mt-6">
                    <h2 id="playing-title" class="text-2xl font-bold">Bienvenido, Dylan</h2>
                    <p class="text-zinc-500 text-sm mt-1">Reproduciendo música sin anuncios · Calidad Alta</p>
                </div>
            </div>
        </main>

        <!-- Right Sidebar (Como en tu segunda imagen) -->
        <aside class="flex-1 bg-black p-4 border-l border-zinc-800 hidden lg:flex flex-col">
            <div class="flex gap-4 mb-6 border-b border-zinc-800 pb-2">
                <button class="text-sm font-bold border-b-2 border-[#a3e635] pb-2 uppercase">A continuación</button>
                <button class="text-sm font-bold text-zinc-500 pb-2 uppercase">Letra</button>
            </div>
            
            <div id="playlist" class="flex-col gap-4 overflow-y-auto custom-scroll pr-2">
                <!-- Los resultados aparecerán aquí -->
                <p class="text-xs text-zinc-600 text-center mt-10">Busca artistas para llenar tu lista</p>
            </div>
        </aside>
    </div>

    <!-- Bottom Controls -->
    <footer class="h-20 bg-[#030303] border-t border-zinc-800 flex items-center px-6 justify-between">
        <div class="flex items-center gap-4 w-1/4">
            <div class="w-12 h-12 bg-zinc-900 rounded-md"></div>
            <div>
                <div class="text-sm font-bold truncate w-32">Esperando...</div>
                <div class="text-xs text-zinc-500">Dylan Music App</div>
            </div>
        </div>

        <div class="flex flex-col items-center gap-2 flex-1">
            <div class="flex items-center gap-6">
                <button class="text-zinc-400 hover:text-white"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button onclick="location.reload()" class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="text-zinc-400 hover:text-white"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
            </div>
            <div class="w-full max-w-md h-1 bg-zinc-800 rounded-full">
                <div class="w-1/3 h-full bg-[#a3e635] rounded-full"></div>
            </div>
        </div>

        <div class="w-1/4 flex justify-end gap-4 text-zinc-400">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <svg class="w-5 h-5 text-[#a3e635]" fill="currentColor" viewBox="0 0 24 24"><path d="M19 12l-7 5-7-5 7-5 7 5zm-7 11l7-5-7-5-7 5 7 5z"/></svg>
        </div>
    </footer>

    <script>
        function searchMusic(event) {
            event.preventDefault();
            const query = document.getElementById('search-input').value;
            if (!query) return;

            // Actualizar Reproductor Principal
            const player = document.getElementById('main-player');
            player.innerHTML = `<iframe src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}&autoplay=1&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            
            document.getElementById('playing-title').innerText = query.toUpperCase();

            // Simular Lista de Reproducción Lateral
            const playlist = document.getElementById('playlist');
            playlist.innerHTML = `
                <div class="flex items-center gap-3 p-2 hover:bg-white/5 rounded-lg cursor-pointer active-glow">
                    <div class="w-10 h-10 bg-zinc-800 rounded"></div>
                    <div class="flex-1"><p class="text-sm font-bold">${query} - Mix Dylan</p><p class="text-xs text-zinc-500">Auto-Generado</p></div>
                    <span class="text-xs text-zinc-600">3:45</span>
                </div>
                ${[1,2,3,4].map(i => `
                <div class="flex items-center gap-3 p-2 hover:bg-white/5 rounded-lg cursor-pointer opacity-50">
                    <div class="w-10 h-10 bg-zinc-800 rounded"></div>
                    <div class="flex-1"><p class="text-sm font-bold">${query} Radio ${i}</p><p class="text-xs text-zinc-500">Siguiente</p></div>
                </div>`).join('')}
            `;
        }
    </script>
</body>
</html>
